<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --grid-a: #1a1e29;
    --grid-b: #1d2230;
    --snake: #6ee7a0;
    --snake-head: #a7f3c4;
    --food: #ff6b6b;
    --text: #e6e8ef;
    --muted: #8b90a0;
    --accent: #6ee7a0;
    --btn: #232838;
    --btn-active: #2f364a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }

  header {
    width: 100%;
    max-width: 560px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 4px;
  }
  header h1 {
    font-size: 18px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .scores { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
  .scores b { color: var(--text); font-weight: 600; margin-left: 6px; }

  #stage {
    position: relative;
    width: 100%;
    max-width: 560px;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 0 0 1px #262b3a, 0 20px 50px rgba(0,0,0,0.5);
    flex-shrink: 1;
    min-height: 0;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 17, 23, 0.82);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    text-align: center;
    padding: 20px;
    transition: opacity .18s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h2 { font-size: 28px; letter-spacing: 0.15em; text-transform: uppercase; }
  #overlay p { color: var(--muted); font-size: 13px; line-height: 1.6; }
  #overlay .final { font-size: 16px; color: var(--text); }
  #overlay .final b { color: var(--accent); }
  #overlay .newbest { color: #ffd166; font-size: 13px; letter-spacing: 0.1em; }

  .btn {
    margin-top: 6px;
    padding: 12px 28px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #0f1117;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn:active { transform: scale(0.97); }

  /* Touch D-pad */
  #dpad {
    display: none;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
    flex-shrink: 0;
  }
  #dpad button {
    border: 0;
    border-radius: 14px;
    background: var(--btn);
    color: var(--text);
    font-size: 24px;
    cursor: pointer;
    touch-action: none;
  }
  #dpad button:active { background: var(--btn-active); }
  #dpad .up    { grid-column: 2; grid-row: 1; }
  #dpad .left  { grid-column: 1; grid-row: 2; }
  #dpad .pause { grid-column: 2; grid-row: 2; font-size: 16px; color: var(--muted); }
  #dpad .right { grid-column: 3; grid-row: 2; }
  #dpad .down  { grid-column: 2; grid-row: 3; }

  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  /* Show D-pad on touch devices; hide keyboard hint */
  @media (pointer: coarse) {
    #dpad { display: grid; }
    .hint.kb { display: none; }
  }
  @media (pointer: fine) {
    .hint.touch { display: none; }
  }

  /* Landscape phones: put the D-pad beside the board */
  @media (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
    #app { flex-direction: row; flex-wrap: wrap; gap: 14px; }
    header { width: auto; flex-direction: column; align-items: flex-start; gap: 6px; }
    #stage { height: calc(100vh - 20px); width: auto; max-width: none; }
    #dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Snake</h1>
    <div class="scores">
      <span>Score<b id="score">0</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
  </header>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2 id="ov-title">Snake</h2>
      <div id="ov-body">
        <p class="hint kb">Arrow keys / WASD to move<br>Space to pause</p>
        <p class="hint touch">Swipe or use the buttons to move<br>Tap the board to pause</p>
      </div>
      <button class="btn" id="ov-btn">Play</button>
    </div>
  </div>

  <div id="dpad">
    <button class="up" data-dir="up" aria-label="Up">▲</button>
    <button class="left" data-dir="left" aria-label="Left">◀</button>
    <button class="pause" data-action="pause" aria-label="Pause">II</button>
    <button class="right" data-dir="right" aria-label="Right">▶</button>
    <button class="down" data-dir="down" aria-label="Down">▼</button>
  </div>

  <p class="hint kb">Arrow keys / WASD · Space to pause · Walls wrap around</p>
  <p class="hint touch">Swipe anywhere on the board · Walls wrap around</p>
</div>

<script>
(() => {
  'use strict';

  // ---------- Config ----------
  const GRID = 20;               // cells per side
  const BASE_SPEED = 140;        // ms per step at start
  const MIN_SPEED = 65;          // fastest allowed
  const SPEED_STEP = 3;          // ms faster per food eaten
  const STORAGE_KEY = 'snake.best';

  // ---------- DOM ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovBody = document.getElementById('ov-body');
  const ovBtn = document.getElementById('ov-btn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const dpad = document.getElementById('dpad');

  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };

  // ---------- State ----------
  let snake, dir, nextDir, food, score, best, speed, state, lastStep, acc;
  let cell = 0;                 // px per cell (in CSS px)
  const dirQueue = [];          // buffered turns for responsive input

  best = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
  bestEl.textContent = best;

  // ---------- Sizing ----------
  function resize() {
    const rect = stage.getBoundingClientRect();
    const size = Math.floor(Math.min(rect.width, rect.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / GRID;
    draw();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // ---------- Game logic ----------
  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid,     y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = DIRS.right;
    dirQueue.length = 0;
    score = 0;
    speed = BASE_SPEED;
    acc = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!occupied.has(x + ',' + y)) free.push({ x, y });
    if (free.length === 0) { food = null; return; }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function queueDir(d) {
    if (!d) return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    // ignore reversals and no-ops relative to the last queued direction
    if (d.x === -last.x && d.y === -last.y) return;
    if (d.x === last.x && d.y === last.y) return;
    if (dirQueue.length < 2) dirQueue.push(d);
  }

  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const head = snake[0];
    const nx = (head.x + dir.x + GRID) % GRID;   // wrap around
    const ny = (head.y + dir.y + GRID) % GRID;

    const ate = food && nx === food.x && ny === food.y;

    // Tail moves out of the way unless we're growing
    const bodyToCheck = ate ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === nx && s.y === ny)) {
      gameOver();
      return;
    }

    snake.unshift({ x: nx, y: ny });
    if (ate) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
      placeFood();
      pulse = 1;
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    const isNew = score > best;
    if (isNew) {
      best = score;
      localStorage.setItem(STORAGE_KEY, String(best));
      bestEl.textContent = best;
    }
    showOverlay('Game Over',
      `<p class="final">Score <b>${score}</b> · Best <b>${best}</b></p>` +
      (isNew && score > 0 ? '<p class="newbest">★ New best!</p>' : ''),
      'Play Again');
    draw();
  }

  // ---------- Overlay / states ----------
  function showOverlay(title, bodyHtml, btnText) {
    ovTitle.textContent = title;
    ovBody.innerHTML = bodyHtml;
    ovBtn.textContent = btnText;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    lastStep = performance.now();
    pulse = 0;
  }
  function pause() {
    if (state !== 'playing') return;
    state = 'paused';
    showOverlay('Paused', '<p>Take a breath.</p>', 'Resume');
  }
  function resume() {
    if (state !== 'paused') return;
    state = 'playing';
    hideOverlay();
    lastStep = performance.now();
  }
  function togglePause() {
    if (state === 'playing') pause();
    else if (state === 'paused') resume();
  }
  function primaryAction() {
    if (state === 'paused') resume();
    else if (state !== 'playing') start();
  }

  // ---------- Rendering ----------
  let pulse = 0;

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const size = cell * GRID;
    const css = getComputedStyle(document.documentElement);

    // board
    ctx.fillStyle = css.getPropertyValue('--grid-a');
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = css.getPropertyValue('--grid-b');
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if ((x + y) % 2) ctx.fillRect(x * cell, y * cell, cell, cell);

    if (!snake) return;

    // food
    if (food) {
      const r = cell * (0.32 + pulse * 0.08);
      ctx.fillStyle = css.getPropertyValue('--food');
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // snake
    const pad = cell * 0.08;
    const rad = cell * 0.28;
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(1, len - 1);
      ctx.fillStyle = i === 0
        ? css.getPropertyValue('--snake-head')
        : `rgba(110, 231, 160, ${1 - t * 0.45})`;
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, rad);
      ctx.fill();
    }

    // eyes
    const h = snake[0];
    const ex = h.x * cell + cell / 2, ey = h.y * cell + cell / 2;
    const off = cell * 0.18, side = cell * 0.16;
    const px = dir.y !== 0 ? side : 0, py = dir.x !== 0 ? side : 0;
    ctx.fillStyle = '#0f1117';
    ctx.beginPath();
    ctx.arc(ex + dir.x * off + px, ey + dir.y * off + py, cell * 0.07, 0, Math.PI * 2);
    ctx.arc(ex + dir.x * off - px, ey + dir.y * off - py, cell * 0.07, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- Loop ----------
  function loop(now) {
    if (state === 'playing') {
      acc += now - lastStep;
      lastStep = now;
      // cap catch-up so a background tab doesn't kill you instantly
      if (acc > speed * 3) acc = speed * 3;
      while (acc >= speed && state === 'playing') {
        acc -= speed;
        step();
      }
      if (pulse > 0) pulse = Math.max(0, pulse - 0.08);
      draw();
    }
    requestAnimationFrame(loop);
  }

  // ---------- Input: keyboard ----------
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };
  window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      if (state === 'over' || state === 'idle') start();
      else togglePause();
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); primaryAction(); return; }
    const d = KEYS[e.key];
    if (!d) return;
    e.preventDefault();
    if (state === 'idle' || state === 'over') { start(); }
    else if (state === 'paused') { resume(); }
    queueDir(DIRS[d]);
  });

  // ---------- Input: swipe / tap on the board ----------
  let touchStart = null;
  const SWIPE_MIN = 18;

  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    touchStart = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
    stage.setPointerCapture?.(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!touchStart || touchStart.moved) return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return;
    touchStart.moved = true;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (state === 'paused') resume();
    if (state === 'playing') queueDir(DIRS[d]);
  });
  const endTouch = e => {
    if (!touchStart) return;
    const wasTap = !touchStart.moved && performance.now() - touchStart.t < 400;
    touchStart = null;
    // A tap on the board pauses; overlay button handles start/resume.
    if (wasTap && state === 'playing') pause();
  };
  stage.addEventListener('pointerup', endTouch);
  stage.addEventListener('pointercancel', () => { touchStart = null; });

  // ---------- Input: D-pad ----------
  dpad.addEventListener('pointerdown', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.preventDefault();
    if (btn.dataset.action === 'pause') {
      if (state === 'idle' || state === 'over') start();
      else togglePause();
      return;
    }
    const d = DIRS[btn.dataset.dir];
    if (state === 'idle' || state === 'over') start();
    else if (state === 'paused') resume();
    queueDir(d);
  });
  dpad.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Overlay button ----------
  ovBtn.addEventListener('click', e => { e.stopPropagation(); primaryAction(); });
  // Stop board pointer events from firing when tapping the overlay itself
  overlay.addEventListener('pointerdown', e => e.stopPropagation());
  overlay.addEventListener('pointerup', e => e.stopPropagation());

  // Pause when the tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pause();
  });

  // ---------- Boot ----------
  state = 'idle';
  reset();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
